# SonarQube analysis, run with `make sonar` on the maintainer's machine. The server's
# address and the token are not here: SONAR_HOST_URL and SONAR_TOKEN come from the
# environment or a git-ignored .env. See CONTRIBUTING.md.
sonar.projectKey=<repository name, lowercase>
sonar.projectName=<Project Name>
sonar.sourceEncoding=UTF-8

# The code. Tests live next to it, so they are kept out of the sources by exclusion and
# picked up again as tests. Compiled output and dependencies are not analysed.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.svelte-kit/**,**/*.test.ts,**/*.spec.ts

# Written by `make sonar` (the repository's `npm run coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Cognitive complexity is not a test's measure: a table of cases reads as one function.
sonar.issue.ignore.multicriteria=testComplexity
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*.test.ts
